name: Import product images
on:
  push:
    branches: [arena/107c3038-nowculture]
    paths: [scripts/import_images.py, .github/workflows/import-images.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/107c3038-nowculture
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all shoe images into assets/images
        run: python3 scripts/import_images.py
      - name: Commit images back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images
          git diff --cached --quiet && echo "no changes" || git commit -m "Import all product images locally into assets/images"
          git push origin arena/107c3038-nowculture
